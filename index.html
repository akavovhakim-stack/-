<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог</title>
  <!-- Скрипт Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Библиотека Swiper для плавного свайпа слайдов -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <style>
    :root {
      --bg-color: #121316;
      --card-bg: #1e2026;
      --accent: #d4a373;
      --text-main: #ffffff;
      --text-muted: #9aa0a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Категории сверху */
    .categories {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid #2e313a;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-btn.active {
      background: var(--accent);
      color: #121316;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Слайдер */
    .swiper {
      width: 100%;
      flex: 1;
      padding: 8px 16px 28px 16px;
    }

    .swiper-slide {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #2c2f38;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .slide-img {
      width: 100%;
      height: 48%;
      object-fit: cover;
      background: #2a2d35;
    }

    .slide-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .badge {
      display: inline-block;
      background: rgba(212, 163, 115, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      width: fit-content;
    }

    .slide-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .slide-specs {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .slide-footer {
      border-top: 1px solid #2e313a;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    .comment-input {
      width: 100%;
      background: #14161a;
      border: 1px solid #2e313a;
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .comment-input:focus {
      border-color: var(--accent);
    }

    .order-btn {
      background: var(--accent);
      color: #121316;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .order-btn:active {
      opacity: 0.85;
    }

    /* Точки пагинации внизу */
    .swiper-pagination-bullet { background: #fff; opacity: 0.3; }
    .swiper-pagination-bullet-active { background: var(--accent); opacity: 1; }
  </style>
</head>
<body>

  <!-- Кнопки категорий -->
  <div class="categories" id="categories"></div>

  <!-- Слайдер -->
  <div class="swiper" id="catalogSwiper">
    <div class="swiper-wrapper" id="slidesWrapper"></div>
    <div class="swiper-pagination"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Раскрываем окно на всю высоту

    // === БАЗА СЛАЙДОВ (здесь легко менять и добавлять свои позиции) ===
    const catalogData = [
      {
        id: "1",
        category: "Кухни",
        title: "Кухня «Лофт Графит»",
        specs: "• Фасады: МДФ эмаль матовая / шпон дуба\n• Фурнитура: с доводчиками\n• Индивидуальные размеры под ваше помещение",
        price: "от 145 000 ₽",
        image: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "2",
        category: "Кухни",
        title: "Кухня «Сканди Беж»",
        specs: "• Фасады: АГТ панель софт-тач\n• Встроенная LED-подсветка рабочей зоны\n• Срок изготовления: от 14 дней",
        price: "от 130 000 ₽",
        image: "https://images.unsplash.com/photo-1556909212-d5b604d0c90d?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "3",
        category: "Шкафы",
        title: "Встроенный шкаф в потолок",
        specs: "• Корпус: ЛДСП Egger 16 мм\n• Фасады: МДФ фрезеровка + зеркало\n• Наполнение проектируется под вас",
        price: "от 75 000 ₽",
        image: "https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?auto=format&fit=crop&w=800&q=80"
      },
      {
        id: "4",
        category: "Гардеробные",
        title: "Гардеробная система «Модерн»",
        specs: "• Выдвижные ящики полного выдвижения\n• Пантографы и подсветка полок\n• Точный замер и 3D-проект",
        price: "от 95 000 ₽",
        image: "https://images.unsplash.com/photo-1558997519-83ea9252edf8?auto=format&fit=crop&w=800&q=80"
      }
    ];

    const categories = ["Все", ...new Set(catalogData.map(item => item.category))];
    let currentCategory = "Все";
    let swiperInstance = null;

    function renderCategories() {
      const container = document.getElementById("categories");
      container.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
          ${cat}
        </button>
      `).join("");
    }

    function renderSlides() {
      const wrapper = document.getElementById("slidesWrapper");
      const filtered = currentCategory === "Все"
        ? catalogData
        : catalogData.filter(item => item.category === currentCategory);

      wrapper.innerHTML = filtered.map(item => `
        <div class="swiper-slide">
          <img class="slide-img" src="${item.image}" alt="${item.title}">
          <div class="slide-content">
            <div>
              <div class="badge">${item.category}</div>
              <div class="slide-title">${item.title}</div>
              <div class="slide-specs">${item.specs.replace(/\n/g, '<br>')}</div>
            </div>
            <div class="slide-footer">
              <div class="price">${item.price}</div>
              <input type="text" id="comment-${item.id}" class="comment-input" placeholder="Ваши размеры или пожелания (необязательно)">
              <button class="order-btn" onclick="sendOrder('${item.id}')">
                Рассчитать стоимость / Заказать
              </button>
            </div>
          </div>
        </div>
      `).join("");

      if (swiperInstance) swiperInstance.destroy(true, true);
      swiperInstance = new Swiper("#catalogSwiper", {
        spaceBetween: 16,
        pagination: { el: ".swiper-pagination", clickable: true }
      });
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderSlides();
    }

    function sendOrder(itemId) {
      const item = catalogData.find(i => i.id === itemId);
      const comment = document.getElementById(`comment-${itemId}`).value.trim();

      const payload = {
        title: item.title,
        category: item.category,
        price: item.price,
        comment: comment || "Без комментария"
      };

      // Отправляем данные обратно в Telegram-бота
      tg.sendData(JSON.stringify(payload));
    }

    renderCategories();
    renderSlides();
  </script>
</body>
</html>
